name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run lint

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run test:unit:run

  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run build

  check-e2e-secrets:
    runs-on: ubuntu-latest
    outputs:
      has-secrets: ${{ steps.check.outputs.has-secrets }}
    steps:
      - id: check
        env:
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          E2E_CLERK_USER_EMAIL: ${{ secrets.E2E_CLERK_USER_EMAIL }}
          E2E_CLERK_USER_PASSWORD: ${{ secrets.E2E_CLERK_USER_PASSWORD }}
        run: |
          missing=""
          if [ -z "${NEXT_PUBLIC_CONVEX_URL}" ]; then missing="${missing} NEXT_PUBLIC_CONVEX_URL"; fi
          if [ -z "${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}" ]; then missing="${missing} NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY"; fi
          if [ -z "${CLERK_SECRET_KEY}" ]; then missing="${missing} CLERK_SECRET_KEY"; fi
          if [ -z "${E2E_CLERK_USER_EMAIL}" ]; then missing="${missing} E2E_CLERK_USER_EMAIL"; fi
          if [ -z "${E2E_CLERK_USER_PASSWORD}" ]; then missing="${missing} E2E_CLERK_USER_PASSWORD"; fi
          if [ -n "${missing}" ]; then
            echo "E2E secrets missing:${missing}"
            echo "has-secrets=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}" != pk_test_* ]]; then
            echo "E2E skipped: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY is not a Clerk development (pk_test_*) key."
            echo "Automated Clerk E2E sign-in requires a development instance. Production (pk_live_*) keys will hang or fail bot detection."
            echo "has-secrets=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "has-secrets=true" >> "$GITHUB_OUTPUT"

  e2e:
    runs-on: ubuntu-latest
    needs: [build, check-e2e-secrets]
    if: needs.check-e2e-secrets.outputs.has-secrets == 'true'
    timeout-minutes: 15
    env:
      CI: true
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      E2E_CLERK_USER_EMAIL: ${{ secrets.E2E_CLERK_USER_EMAIL }}
      E2E_CLERK_USER_PASSWORD: ${{ secrets.E2E_CLERK_USER_PASSWORD }}
      NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run build
      - run: npm run test:e2e
